<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LCDPR-Pro - Sistema de Apuração Rural</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-8">
        <!-- Cabeçalho -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-emerald-800">LCDPR-Pro</h1>
            <p class="text-gray-500 text-sm mt-1">Plataforma oficial de testes e downloads</p>
        </div>

        <!-- Abas de Navegação (Entrar / Cadastrar) -->
        <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-bold rounded-lg transition bg-white text-emerald-800 shadow">Entrar</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition text-gray-500 hover:text-gray-800">Cadastrar</button>
        </div>

        <!-- Formulário de Login -->
        <div id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">E-mail</label>
                <input type="email" id="login-email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Senha</label>
                <input type="password" id="login-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none" placeholder="••••••••">
            </div>
            <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-lg transition">Acessar Sistema</button>
        </div>

        <!-- Formulário de Cadastro -->
        <div id="form-register" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">E-mail</label>
                <input type="email" id="reg-email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Definir Senha</label>
                <input type="password" id="reg-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none" placeholder="••••••••">
            </div>
            <button onclick="handleRegister()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-lg transition">Criar Conta</button>
        </div>

        <!-- Mensagem de Feedback -->
        <div id="msg" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        function switchTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const msg = document.getElementById('msg');
            msg.innerText = '';

            if (tab === 'login') {
                loginTab.className = "flex-1 py-2 text-sm font-bold rounded-lg transition bg-white text-emerald-800 shadow";
                regTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition text-gray-500 hover:text-gray-800";
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regTab.className = "flex-1 py-2 text-sm font-bold rounded-lg transition bg-white text-emerald-800 shadow";
                loginTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition text-gray-500 hover:text-gray-800";
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        async function handleRegister() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const msg = document.getElementById('msg');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                msg.style.color = data.success ? 'green' : 'red';
                msg.innerText = data.message;
                if(data.success) setTimeout(() => switchTab('login'), 2000);
            } catch (err) {
                msg.style.color = 'red';
                msg.innerText = 'Erro ao conectar ao servidor.';
            }
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('msg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    msg.style.color = 'green';
                    msg.innerText = 'Login autorizado! Redirecionando...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.message;
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.innerText = 'Erro ao conectar ao servidor.';
            }
        }
    </script>
</body>
</html>
